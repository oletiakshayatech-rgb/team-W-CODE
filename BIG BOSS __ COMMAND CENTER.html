<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>BIG BOSS // COMMAND CENTER</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070b;--pn:rgba(14,18,26,.78);--ln:rgba(140,170,200,.16);--tx:#e6ecf2;--mu:#7d8a99;--cy:#38e1ff;--rd:#e0203c;--vi:#8a6bff;--gd:#d9b86a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 70% -10%,rgba(138,107,255,.14),transparent),radial-gradient(700px 500px at 0 100%,rgba(56,225,255,.08),transparent),var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;z-index:0}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(circle,transparent 55%,rgba(0,0,0,.6));z-index:90}
.m{font-family:'JetBrains Mono',monospace}.o{font-family:Orbitron,sans-serif;letter-spacing:.16em;text-transform:uppercase}
#app{position:relative;z-index:1;display:grid;grid-template-columns:210px 1fr 270px;grid-template-rows:56px 1fr;height:100%}
#top{grid-column:1/4;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--ln);background:rgba(8,11,17,.85);backdrop-filter:blur(10px);overflow-x:auto;white-space:nowrap}
#side{border-right:1px solid var(--ln);padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:rgba(8,11,17,.6);overflow-y:auto}
#main{overflow-y:auto;padding:20px;min-width:0}
#logp{border-left:1px solid var(--ln);padding:14px;overflow-y:auto;background:rgba(8,11,17,.6)}
.nav{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;color:var(--mu);font:600 11px Orbitron;letter-spacing:.14em;border-left:2px solid transparent;transition:.2s}
.nav:hover{color:var(--tx);background:rgba(56,225,255,.05)}.nav.on{color:var(--cy);border-color:var(--cy);background:linear-gradient(90deg,rgba(56,225,255,.12),transparent)}
.pn{position:relative;background:var(--pn);border:1px solid var(--ln);backdrop-filter:blur(8px);padding:16px;box-shadow:inset 0 0 30px rgba(255,255,255,.015),0 10px 30px rgba(0,0,0,.4);animation:in .35s both}
.pn:before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:1px solid var(--cy);border-left:1px solid var(--cy)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.lb{font:600 10px 'JetBrains Mono';letter-spacing:.2em;color:var(--mu);text-transform:uppercase}
h1,h2{margin:0}h1{font:900 26px Orbitron;letter-spacing:.14em}h2{font:700 13px Orbitron;letter-spacing:.2em;margin-bottom:12px}
.bt{cursor:pointer;background:linear-gradient(#1b212c,#11151d);color:var(--tx);border:1px solid var(--ln);padding:8px 12px;font:600 10px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;transition:.2s}
.bt:hover{border-color:var(--cy);box-shadow:0 0 14px rgba(56,225,255,.25);transform:translateY(-1px)}
.bt.p{border-color:var(--cy);color:var(--cy)}.bt.d{border-color:var(--rd);color:#ff6a80}.bt.d:hover{box-shadow:0 0 14px rgba(224,32,60,.45)}.bt.v{border-color:var(--vi);color:#b7a4ff}.bt.y{border-color:var(--gd);color:var(--gd)}
.bt[disabled]{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
input,select,textarea{background:#0b0f16;border:1px solid var(--ln);color:var(--tx);padding:8px;font:13px Inter;width:100%}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cy);animation:pl 2s infinite;margin-right:6px}.dot.r{background:var(--rd)}
@keyframes pl{50%{opacity:.35;box-shadow:0 0 8px currentColor}}
.bd{font:600 9px 'JetBrains Mono';letter-spacing:.12em;padding:2px 6px;border:1px solid;margin-right:4px;display:inline-block}
.b-cap{color:var(--gd);border-color:var(--gd);animation:gp 2.4s infinite}.b-imm{color:var(--cy);border-color:var(--cy)}.b-nom{color:#ff6a80;border-color:var(--rd)}.b-ev{color:var(--mu);border-color:var(--mu)}
@keyframes gp{50%{box-shadow:0 0 12px rgba(217,184,106,.5)}}
.cc{cursor:pointer;transition:.2s}.cc:hover{transform:translateY(-4px);border-color:var(--cy)}.ev{opacity:.45;filter:grayscale(1)}
.av{width:42px;height:42px;border:1px solid var(--cy);display:grid;place-items:center;font:700 16px Orbitron;color:var(--cy);border-radius:50%;box-shadow:0 0 12px rgba(56,225,255,.2)}
table{width:100%;border-collapse:collapse}th{text-align:left}th,td{padding:10px 8px;border-bottom:1px solid var(--ln)}tr{animation:in .3s both}
.tw{overflow-x:auto}.bar{height:6px;background:#141a24}.bar i{display:block;height:100%;transition:width .6s}
.dz{border-color:var(--rd);background:repeating-linear-gradient(135deg,rgba(224,32,60,.07) 0 10px,transparent 10px 20px),var(--pn);overflow:hidden}
.dz:after{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rd),transparent);animation:sc 3s linear infinite}
@keyframes sc{from{top:0}to{top:100%}}
.cap{border-color:var(--gd);background:radial-gradient(circle at 50% 0,rgba(217,184,106,.16),transparent 60%),var(--pn);text-align:center;padding:30px}
.lg{font:11px 'JetBrains Mono';border-left:1px solid var(--ln);padding:0 0 12px 10px;animation:in .3s both}
#md{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(2,4,8,.7);backdrop-filter:blur(8px);padding:14px}
#md.on{display:grid}#mb{width:min(480px,100%);max-height:90%;overflow:auto}
.evm{border-color:var(--rd)!important;background:repeating-linear-gradient(45deg,rgba(224,32,60,.12) 0 12px,rgba(0,0,0,.4) 12px 24px),#12060a!important;box-shadow:0 0 60px rgba(224,32,60,.3)!important}
#ts{position:fixed;right:16px;bottom:16px;z-index:110;display:flex;flex-direction:column;gap:8px}
.t{background:#0b0f16;border:1px solid var(--cy);padding:10px 14px;font:11px 'JetBrains Mono';letter-spacing:.1em;animation:in .3s both}.t.e{border-color:var(--rd);color:#ff6a80}
#bc{position:fixed;left:0;right:0;top:56px;z-index:95;text-align:center;padding:22px;background:linear-gradient(#1a0509,#0b0f16);border-bottom:2px solid var(--rd);display:none;animation:in .4s both}
.tm{font:900 64px Orbitron;color:var(--cy);text-shadow:0 0 24px var(--cy);text-align:center}.tm.w{color:var(--gd);text-shadow:0 0 24px var(--gd)}.tm.x{color:var(--rd);text-shadow:0 0 24px var(--rd);animation:pl 1s infinite}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.cam{position:relative;aspect-ratio:16/10;border:1px solid var(--ln);background:radial-gradient(circle at 50% 60%,#18232f,#05080c);overflow:hidden;font:9px 'JetBrains Mono';letter-spacing:.1em;color:#9fd8e8}
.cam:before{content:"";position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
.cam:after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;z-index:1;background:linear-gradient(transparent,rgba(56,225,255,.1),transparent);animation:rl 4s linear infinite}
@keyframes rl{to{top:100%}}
.cam span{position:absolute;z-index:2}.cam .sil{position:absolute;inset:0;display:grid;place-items:center;font:900 54px Orbitron;color:rgba(140,170,200,.13)}
.cam.al{border-color:var(--rd);box-shadow:inset 0 0 30px rgba(224,32,60,.35)}.cam.off{filter:grayscale(1);animation:fk .15s steps(2) infinite}
@keyframes fk{50%{opacity:.8}}.sig i{display:inline-block;width:3px;background:var(--cy);margin-right:1px;vertical-align:bottom}
.stp{height:10px;margin:-16px -16px 14px;background:repeating-linear-gradient(45deg,var(--rd) 0 10px,#000 10px 20px)}
.xs{position:absolute;left:0;right:0;height:2px;background:var(--rd);box-shadow:0 0 14px var(--rd);animation:sc 2s linear infinite;pointer-events:none}
.gl{animation:gl .3s steps(2) 4}@keyframes gl{25%{transform:translate(-4px,1px);filter:hue-rotate(40deg) contrast(1.3)}75%{transform:translate(4px,-1px);filter:saturate(2)}}
#xo{position:fixed;inset:0;z-index:120;display:none;place-items:center;text-align:center;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 4px),radial-gradient(circle,#2a060d,#080204)}
#xo.on{display:grid;animation:fl 1s}@keyframes fl{0%{background:#e0203c}12%{background:#080204}}
#xo:before,#xo:after{content:"";position:absolute;left:0;right:0;height:22px;background:repeating-linear-gradient(45deg,var(--rd) 0 14px,#000 14px 28px)}#xo:before{top:0}#xo:after{bottom:0}
#mb.wide{width:min(920px,100%)}.cam canvas{display:block;width:100%;height:100%}
.cw{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.cam .xh{left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 10px;border:1px solid var(--cy);background:rgba(5,7,11,.75);font:600 10px 'JetBrains Mono';letter-spacing:.2em;color:var(--cy);opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
@media(hover:hover){.cam:hover{border-color:var(--cy);box-shadow:0 0 24px rgba(56,225,255,.25)}.cam:hover .xh{opacity:1}}
#cv{position:fixed;inset:0;z-index:105;display:none;place-items:center;background:rgba(2,4,8,.9);backdrop-filter:blur(10px)}#cv.on{display:grid}
#cvp{width:95vw;max-height:96dvh;display:flex;flex-direction:column;gap:10px;overflow-y:auto;border-color:var(--cy)}
#cvw{width:min(100%,calc((100dvh - 230px)*1.6));margin:0 auto;flex:none}
.cvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.cvb{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.cvb .bt{min-height:46px}
#main{overflow-x:hidden}h1{overflow-wrap:anywhere}
@media(pointer:coarse){.bt{min-height:44px;padding:10px 14px}.nav{min-height:44px}}
@media(max-width:700px){.hm{display:none}#top{gap:10px;padding:0 10px;overflow:hidden}#top .o{font-size:10px;letter-spacing:.08em}h1{font-size:18px}.cw{grid-template-columns:repeat(2,1fr);gap:8px}#cvp{width:100vw;height:100dvh;max-height:100dvh;border:0}#cvw{width:100%}}
@media(min-width:1900px){#app{zoom:1.25;height:calc(100%/1.25)}.cw{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}}
@media(min-width:2600px){#app{zoom:1.6;height:calc(100%/1.6)}}
.alb{border:1px solid var(--rd);background:repeating-linear-gradient(45deg,rgba(224,32,60,.2) 0 10px,transparent 10px 20px);padding:12px;animation:pl 1.4s infinite}
#mob{display:none}
@media(max-width:1100px){#app{grid-template-columns:64px 1fr}#logp{display:none}.nav span{display:none}#side .lb{display:none}}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:56px 1fr 52px}#side{grid-row:3;flex-direction:row;overflow-x:auto;border-top:1px solid var(--ln);border-right:0;padding:4px}#top{grid-column:1}#main{padding:12px}.tm{font-size:44px}#mb{width:100%;height:100%;max-height:100%}}
</style></head><body>
<div id="app"><div id="top"></div><nav id="side"></nav><main id="main"></main><aside id="logp"></aside></div>
<div id="bc"></div><div id="xo"></div><div id="cv"></div><div id="md"><div id="mb" class="pn"></div></div><div id="ts"></div>
<script>
const K='bbcc_v3',TEAMS=['Phoenix','Titans','Wolves'];
const seedC=[['Aarav','Phoenix',870],['Riya','Titans',810],['Kabir','Wolves',760],['Ananya','Phoenix',720],['Vihaan','Titans',680],['Meera','Wolves',640],['Arjun','Phoenix',590],['Tara','Titans',530],['Ishaan','Wolves',470],['Naina','Phoenix',420]];
const seed=()=>({c:seedC.map((x,i)=>({id:i+1,name:x[0],team:x[1],pts:x[2],ev:0,imm:['Riya','Aarav'].includes(x[0]),nom:['Kabir','Tara','Ishaan'].includes(x[0]),cap:x[0]=='Riya',tr:0})),
tasks:[['THE MEMORY GRID','Recall the sequence of 12 lit tiles.','Aarav',100,'10:00','completed'],["CAPTAIN'S CHALLENGE",'Captain picks a duel for immunity.','Riya',50,'12:30','active'],['SECRET MISSION','Covertly swap two house items.','Meera',75,'14:00','pending'],['TEAM SURVIVAL','Teams hold the plank for the longest.','Phoenix',150,'16:00','pending'],['PUZZLE PROTOCOL','Solve the cipher wall in 10 minutes.','Vihaan',60,'09:00','completed']].map((t,i)=>({id:i+1,n:t[0],d:t[1],to:t[2],r:t[3],dl:t[4],s:t[5]})),
log:[],ann:[],nh:[1,2,2,3,3],tl:600,tmax:600,run:0,nid:11,tid:6,al:[],mic:{}});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
let view='overview',sel=null,q='',flt='ALL',timer=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),C=id=>S.c.find(x=>x.id==id),act=()=>S.c.filter(x=>!x.ev);
const now=()=>new Date().toTimeString().slice(0,8);
const ranks=()=>{const r={};[...act()].sort((a,b)=>b.pts-a.pts).forEach((c,i)=>r[c.id]=i+1);return r};
function log(a,d){S.log.unshift({t:now(),a,d});S.log=S.log.slice(0,80)}
function toast(m,e){const d=document.createElement('div');d.className='t'+(e?' e':'');d.textContent=(e?'⚠ ':'✓ ')+m;$('#ts').appendChild(d);setTimeout(()=>d.remove(),3000)}
function commit(){save();render()}
const mod=(h,cls)=>{$('#mb').className='pn '+(cls||'');$('#mb').innerHTML=h;$('#md').classList.add('on')};
const closeM=()=>$('#md').classList.remove('on');
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};
const bdg=c=>(c.ev?'<span class="bd b-ev">EVICTED</span>':'')+(c.cap?'<span class="bd b-cap">👑 CAPTAIN</span>':'')+(c.imm&&!c.ev?'<span class="bd b-imm">🔒 IMMUNE</span>':'')+(c.nom&&!c.ev?'<span class="bd b-nom">⚠ NOMINATED</span>':'');
// ACTIONS
function addPts(id,n,why){const c=C(id);if(!c||c.ev)return toast('Contestant is evicted',1);const b=ranks();c.pts=Math.max(0,c.pts+n);snap();const a=ranks();act().forEach(x=>x.tr=(b[x.id]||a[x.id])-a[x.id]);log((n>0?'+':'')+n+' POINTS',c.name.toUpperCase()+' · '+(why||'BIG BOSS DECISION'));toast('POINTS UPDATED');commit()}
function nominate(id){const c=C(id);if(c.ev)return toast('Cannot nominate evicted contestant',1);if(c.imm)return mod('<h2 class="o" style="color:#ff6a80">ACCESS DENIED</h2><p>CONTESTANT PROTECTED BY IMMUNITY PROTOCOL.</p><button class="bt d" onclick="closeM()">ACKNOWLEDGE</button>','evm');if(c.nom)return toast('Already nominated',1);c.nom=1;S.nh.push(act().filter(x=>x.nom).length);log('NOMINATION',c.name.toUpperCase());toast('NOMINATION REGISTERED');commit()}
function unnom(id){C(id).nom=0;log('NOMINATION REMOVED',C(id).name.toUpperCase());toast('NOMINATION REMOVED');commit()}
function immune(id,on){const c=C(id);if(c.ev)return toast('Cannot grant immunity to evicted contestant',1);c.imm=on;if(on)c.nom=0;log(on?'IMMUNITY GRANTED':'IMMUNITY REVOKED',c.name.toUpperCase());toast(on?'IMMUNITY GRANTED':'IMMUNITY REVOKED');commit()}
function capt(id){const c=C(id);if(c.ev)return toast('Cannot make evicted contestant captain',1);S.c.forEach(x=>x.cap=0);c.cap=1;log('CAPTAIN CHANGED',c.name.toUpperCase());toast('CAPTAINCY TRANSFERRED');closeM();commit()}
function evictAsk(id){const c=C(id);if(c.ev)return toast('Already evicted',1);mod(`<div class="stp"></div><div class="xs"></div><div class="lb" style="color:#ff6a80"><span class="dot r"></span>CLEARANCE: OMEGA · AUTH BIG BOSS</div><h2 class="o" style="color:#fff;font-size:20px;text-shadow:0 0 18px var(--rd);margin-top:8px">⚠ EVICTION PROTOCOL</h2><p>You are about to remove:</p><div class="o" style="font-size:34px;margin:14px 0;color:#fff;text-shadow:0 0 20px var(--rd)">${c.name}</div><p>from the active House.</p><div class="row"><button class="bt" onclick="closeM()">CANCEL</button><button class="bt d" id="xc" disabled onclick="evict(${id})">ARMING…</button></div><div class="stp" style="margin:14px -16px -16px"></div>`,'evm');$('#mb').classList.add('gl');setTimeout(()=>{const b=$('#xc');if(b){b.disabled=false;b.textContent='CONFIRM EVICTION'}},1500)}
function evict(id){const c=C(id);if(c.ev)return;c.ev=1;c.nom=0;c.imm=0;const wasCap=c.cap;c.cap=0;if(wasCap){const n=[...act()].sort((a,b)=>b.pts-a.pts)[0];if(n){n.cap=1;log('CAPTAIN CHANGED',n.name.toUpperCase()+' (AUTO)')}}log('EVICTED',c.name.toUpperCase());sel=null;closeM();commit();xout(c.name.toUpperCase());toast('EVICTION CONFIRMED',1)}
function xout(n){const o=$('#xo');o.innerHTML=`<div><div class="lb" style="color:#ff6a80"><span class="dot r"></span>SIGNAL LOST · FEED TERMINATED</div><div class="o gl" style="font-size:clamp(22px,5vw,46px);margin:18px 0;color:#fff;text-shadow:0 0 30px var(--rd)">CONTESTANT REMOVED FROM HOUSE</div><div class="o" style="font-size:20px;color:#ff6a80">${n}</div><div class="bar" style="width:260px;margin:18px auto"><i id="xb" style="background:var(--rd);width:0;transition:width 2.2s linear"></i></div></div>`;o.className='on';requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$('#xb');if(b)b.style.width='100%'}));$('#app').classList.add('gl');setTimeout(()=>{o.className='';$('#app').classList.remove('gl')},2600)}
function addC(){const n=$('#f1').value.trim();if(!n)return toast('Name required',1);if(S.c.some(x=>x.name.toLowerCase()==n.toLowerCase()))return toast('Name already exists',1);S.c.push({id:S.nid++,name:n,team:$('#f2').value,pts:+$('#f3').value||0,ev:0,imm:0,nom:0,cap:0,tr:0});log('CONTESTANT ADDED',n.toUpperCase());closeM();toast('CONTESTANT ADDED');commit()}
function addMod(){mod(`<h2 class="o">ADD CONTESTANT</h2><div class="g"><input id="f1" placeholder="Name"><select id="f2">${TEAMS.map(t=>`<option>${t}`).join('')}</select><input id="f3" type="number" placeholder="Starting points" value="500"><div class="row"><button class="bt" onclick="closeM()">CANCEL</button><button class="bt p" onclick="addC()">ADD</button></div></div>`)}
function taskMod(){mod(`<h2 class="o">CREATE TASK</h2><div class="g"><input id="f1" placeholder="Task name"><textarea id="f2" placeholder="Description"></textarea><input id="f3" type="number" placeholder="Reward" value="50"><input id="f4" placeholder="Deadline" value="18:00"><div class="row"><button class="bt" onclick="closeM()">CANCEL</button><button class="bt p" onclick="addT()">CREATE</button></div></div>`)}
function addT(){const n=$('#f1').value.trim();if(!n)return toast('Task name required',1);S.tasks.unshift({id:S.tid++,n:n.toUpperCase(),d:$('#f2').value,to:'—',r:+$('#f3').value||0,dl:$('#f4').value,s:'pending'});log('TASK CREATED',n.toUpperCase());closeM();toast('TASK CREATED');commit()}
function assignMod(id){mod(`<h2 class="o">ASSIGN TASK</h2><select id="f1">${act().map(c=>`<option>${c.name}`).join('')}</select><div class="row" style="margin-top:12px"><button class="bt" onclick="closeM()">CANCEL</button><button class="bt p" onclick="assign(${id})">ASSIGN</button></div>`)}
function assign(id){const t=S.tasks.find(x=>x.id==id),c=act().find(x=>x.name==$('#f1').value);if(!c)return toast('Cannot assign to evicted contestant',1);t.to=c.name;log('TASK ASSIGNED',t.n+' → '+c.name.toUpperCase());closeM();toast('TASK ASSIGNED');commit()}
function taskSt(id,s){const t=S.tasks.find(x=>x.id==id);if(s=='del'){S.tasks=S.tasks.filter(x=>x.id!=id);log('TASK DELETED',t.n)}else{t.s=s;log(s=='completed'?'TASK COMPLETED':'TASK STARTED',t.n);if(s=='completed'){const c=act().find(x=>x.name==t.to);if(c&&t.r){commit();return addPts(c.id,t.r,'Task reward')}}}toast(s=='completed'?'TASK COMPLETED':s=='del'?'TASK DELETED':'TASK STARTED');commit()}
function bcast(){const t=$('#an').value.trim();if(!t)return toast('Enter an announcement',1);S.ann.unshift({t,at:now()});log('BROADCAST',t.slice(0,40));showBc(t,now());commit();toast('TRANSMITTED')}

function tmCtl(a){if(a=='s'){if(S.tl==0)S.tl=S.tmax;S.run=1}if(a=='p')S.run=0;if(a=='r'){S.run=0;S.tl=S.tmax}save();tmDraw();if(a=='s')log('TIMER STARTED','TASK TIMER')}
function tmDraw(){const e=$('#tm');if(!e)return;const l=S.tl,m=String(l/60|0).padStart(2,'0'),s=String(l%60).padStart(2,'0');e.className='tm '+(l==0?'x':l<=60?'w':'');e.textContent=l==0?'TIME EXPIRED':m+' : '+s;const b=$('#tb');if(b)b.style.width=(S.tl/S.tmax*100)+'%'}

function gauge(v){const col=v>66?'var(--rd)':v>33?'var(--gd)':'var(--cy)',L=v>66?'HIGH':v>33?'ELEVATED':'LOW',r=70,ci=2*Math.PI*r;return `<svg viewBox="0 0 180 180" width="190" style="flex:none"><circle cx="90" cy="90" r="${r}" fill="none" stroke="#141a24" stroke-width="8"/><circle cx="90" cy="90" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-dasharray="${ci*v/100} ${ci}" transform="rotate(-90 90 90)" style="filter:drop-shadow(0 0 6px ${col});transition:.8s"/><circle cx="90" cy="90" r="82" fill="none" stroke="var(--ln)" stroke-dasharray="2 6"><animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="40s" repeatCount="indefinite"/></circle><text x="90" y="92" text-anchor="middle" fill="#e6ecf2" font-family="Orbitron" font-size="34" data-n="${v}">${v}%</text><text x="90" y="116" text-anchor="middle" fill="${col}" font-family="JetBrains Mono" font-size="11" letter-spacing="3">${L}</text></svg>`}
